<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Website Chatbot</title><link rel="stylesheet" href="/static/style.css"><main><h1>Cloud Website Chatbot</h1><p>Retrieval-based commercial FAQ chatbot. Ask about pricing, hours, support or cloud hosting.</p><section id="messages" aria-live="polite"></section><form id="chat"><input name="message" placeholder="Type your question" maxlength="1000" required><button>Send</button></form></main><script>let form=document.querySelector('#chat'),box=document.querySelector('#messages');function add(who,text){let p=document.createElement('p');p.textContent=who+': '+text;box.append(p)}form.onsubmit=async e=>{e.preventDefault();let message=new FormData(form).get('message');add('You',message);form.reset();try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});let d=await r.json();add('Bot',d.reply||d.error)}catch(e){add('System','Network error')}};</script></html>
